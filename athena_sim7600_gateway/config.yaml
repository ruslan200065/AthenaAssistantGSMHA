name: Athena SIM7600 Gateway
version: "1.2.6"
slug: athena_sim7600_gateway
description: SIM7600 GSM + USB camera bridge for Athena Core and Home Assistant
url: https://github.com/ruslan200065/AthenaAssistantGSMHA
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
uart: true
usb: true
video: true
audio: true
ingress: true
ingress_port: 8099
panel_icon: mdi:phone-in-talk
panel_title: Athena GSM
watchdog: "http://[HOST]:8099/api/health"
options:
  athena_enabled: false
  athena_url: "ws://homeassistant.local:8000/api/device/ws"
  athena_token: ""
  athena_verify_tls: true
  api_token: "change-me-please"
  modem_port: "/dev/ttyUSB2"
  modem_mock: false
  unknown_callers: "notify"
  allowed_numbers: ""
  bridge_room: ""
  camera_enabled: true
  camera_device: "/dev/video0"
  camera_mock: false
  audio_enabled: true
  audio_device: "auto"
  pcm_port: "/dev/ttyUSB4"
  playback_volume: 50
  log_level: "INFO"
schema:
  athena_enabled: bool
  athena_url: str
  athena_token: password
  athena_verify_tls: bool
  api_token: password
  modem_port: str
  modem_mock: bool
  unknown_callers: list(allow|notify|reject)
  allowed_numbers: str
  bridge_room: str
  camera_enabled: bool
  camera_device: str
  camera_mock: bool
  audio_enabled: bool
  audio_device: str
  pcm_port: str
  playback_volume: int(0,200)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
