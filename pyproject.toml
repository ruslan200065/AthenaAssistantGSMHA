[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athena-sim7600-gateway"
version = "1.3.1"
description = "SIM7600 GSM gateway for Athena Core and Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Athena" }]
keywords = ["athena", "sim7600", "gsm", "home-assistant", "telephony"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12.0",
  "pyserial>=3.5",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "httpx>=0.25"]

[project.scripts]
sim7600-gateway = "sim7600_gateway.__main__:main"
sim7600-probe = "sim7600_gateway.tools.probe:main"

[tool.hatch.build.targets.wheel]
packages = ["sim7600_gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]
