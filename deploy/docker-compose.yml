services:
  sim7600-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sim7600-gateway
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/ttyUSB2:/dev/ttyUSB2
      # SIM7600 USB audio for voice calls / call.bridge (optional):
      - /dev/snd:/dev/snd
    group_add:
      - audio
    volumes:
      - ./config.toml:/data/config.toml:ro
      - ./data:/data
    environment:
      - TZ=Europe/Moscow
    # If your modem is not ttyUSB2, change the device mapping above:
    #   ls -l /dev/serial/by-id/
